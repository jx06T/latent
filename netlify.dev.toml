[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro 產生的 SSR 函式由 adapter 自動放入 dist/
# 獨立的自訂函式放在 netlify/functions/
[functions]
  node_bundler = "esbuild"

[functions."keep-alive"]
  schedule = "0 0 */5 * *"

[dev]
  command = "pnpm run dev"
  targetPort = 4321
  publish = "dist"
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:4321/api/:splat"
  status = 200
  force = true